<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="bankBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="50%" stop-color="#F8F7F3" />
      <stop offset="100%" stop-color="#EEF1F6" />
    </linearGradient>
    <linearGradient id="chartGradient" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FF8A00" stop-opacity="0.25" />
      <stop offset="100%" stop-color="#FF8A00" stop-opacity="0.0" />
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#bankBg)" />

  <!-- Classical Architectural Colonnade & Financial District Perspective -->
  <g stroke="#101B35" stroke-opacity="0.12" stroke-width="2">
    <!-- Colonnade Columns -->
    <line x1="260" y1="0" x2="260" y2="1080" />
    <line x1="560" y1="0" x2="560" y2="1080" />
    <line x1="1360" y1="0" x2="1360" y2="1080" />
    <line x1="1660" y1="0" x2="1660" y2="1080" />
    <!-- Classical Cross Archways -->
    <line x1="0" y1="280" x2="560" y2="0" />
    <line x1="0" y1="580" x2="560" y2="300" />
    <line x1="1360" y1="0" x2="1920" y2="280" />
    <line x1="1360" y1="300" x2="1920" y2="580" />
  </g>

  <!-- Treasury Capital Velocity Chart -->
  <g transform="translate(360, 260)">
    <!-- Base Grid Lines -->
    <line x1="0" y1="460" x2="1200" y2="460" stroke="#101B35" stroke-opacity="0.2" stroke-width="2" />
    <line x1="0" y1="310" x2="1200" y2="310" stroke="#101B35" stroke-opacity="0.08" stroke-dasharray="6,6" />
    <line x1="0" y1="160" x2="1200" y2="160" stroke="#101B35" stroke-opacity="0.08" stroke-dasharray="6,6" />
    <line x1="0" y1="10" x2="1200" y2="10" stroke="#101B35" stroke-opacity="0.08" stroke-dasharray="6,6" />

    <!-- Shaded Growth Vector -->
    <path d="M 0,420 Q 220,380 380,310 T 720,200 T 960,110 T 1200,40 L 1200,460 L 0,460 Z" 
          fill="url(#chartGradient)" />

    <!-- Ascending Primary Trend Line -->
    <path d="M 0,420 Q 220,380 380,310 T 720,200 T 960,110 T 1200,40" 
          fill="none" stroke="#FF8A00" stroke-width="4.5" />

    <!-- Institutional Candlestick Pillars -->
    <g fill="#101B35">
      <rect x="200" y="330" width="22" height="60" rx="4" />
      <line x1="211" y1="300" x2="211" y2="420" stroke="#101B35" stroke-width="2" />

      <rect x="360" y="280" width="22" height="70" rx="4" fill="#FF8A00" />
      <line x1="371" y1="240" x2="371" y2="380" stroke="#FF8A00" stroke-width="2" />

      <rect x="540" y="220" width="22" height="90" rx="4" />
      <line x1="551" y1="180" x2="551" y2="340" stroke="#101B35" stroke-width="2" />

      <rect x="720" y="170" width="22" height="85" rx="4" fill="#FF8A00" />
      <line x1="731" y1="130" x2="731" y2="290" stroke="#FF8A00" stroke-width="2" />

      <rect x="920" y="100" width="22" height="110" rx="4" />
      <line x1="931" y1="60" x2="931" y2="240" stroke="#101B35" stroke-width="2" />

      <rect x="1100" y="50" width="22" height="80" rx="4" fill="#FF8A00" />
      <line x1="1111" y1="20" x2="1111" y2="160" stroke="#FF8A00" stroke-width="2" />
    </g>

    <!-- Global Cross-Border Arcs -->
    <path d="M 180,460 C 400,60 800,60 1020,460" fill="none" stroke="#101B35" stroke-opacity="0.25" stroke-width="2" />
    <path d="M 380,460 C 600,100 900,100 1140,460" fill="none" stroke="#FF8A00" stroke-opacity="0.35" stroke-width="2" />
  </g>

  <!-- Editorial Info Cards -->
  <g font-family="'Plus Jakarta Sans', sans-serif">
    <rect x="80" y="80" width="420" height="150" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    <text x="110" y="120" font-size="12" font-weight="bold" fill="#FF8A00" letter-spacing="2">SECTOR 08 • CORPORATE FINANCE</text>
    <text x="110" y="155" font-size="22" font-weight="bold" font-family="'Playfair Display', serif" fill="#101B35">Trade Finance &amp; Lending</text>
    <text x="110" y="190" font-size="13" fill="#5A6474">Cross-Border Syndication • Letters of Credit</text>

    <rect x="1420" y="80" width="420" height="150" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    <text x="1450" y="120" font-size="12" font-weight="bold" fill="#101B35" letter-spacing="2">CAPITAL ADVISORY</text>
    <text x="1450" y="155" font-size="22" font-weight="bold" font-family="'Playfair Display', serif" fill="#101B35">Treasury Solutions</text>
    <text x="1450" y="190" font-size="13" fill="#5A6474">Forex Risk Hedging • Infrastructure Debt</text>
  </g>

  <text x="960" y="990" text-anchor="middle" font-family="'Playfair Display', serif" font-size="26" font-style="italic" fill="#101B35" fill-opacity="0.35">
    Arise Hope Group • Corporate Lending, Trade Finance &amp; Treasury Solutions
  </text>
</svg>