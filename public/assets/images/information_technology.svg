<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1920 1080" width="1920" height="1080">
  <defs>
    <linearGradient id="itLightBg" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" />
      <stop offset="60%" stop-color="#F8F7F3" />
      <stop offset="100%" stop-color="#EDF0F5" />
    </linearGradient>
  </defs>

  <rect width="1920" height="1080" fill="url(#itLightBg)" />

  <!-- Data Center Perspective Grid Lines -->
  <g stroke="#101B35" stroke-opacity="0.08" stroke-width="1.5">
    <line x1="0" y1="180" x2="960" y2="520" />
    <line x1="1920" y1="180" x2="960" y2="520" />
    <line x1="0" y1="900" x2="960" y2="520" />
    <line x1="1920" y1="900" x2="960" y2="520" />
    <line x1="960" y1="0" x2="960" y2="1080" />
  </g>

  <!-- Server Rack Elevation Enclosures (Architectural Cleanroom) -->
  <!-- Left Corridor Column -->
  <g stroke="#101B35" stroke-width="2">
    <polygon points="120,180 580,360 580,780 120,940" fill="#FFFFFF" fill-opacity="0.9" />
    <line x1="260" y1="240" x2="260" y2="880" stroke-opacity="0.3" />
    <line x1="420" y1="300" x2="420" y2="830" stroke-opacity="0.3" />
  </g>

  <!-- Right Corridor Column -->
  <g stroke="#101B35" stroke-width="2">
    <polygon points="1800,180 1340,360 1340,780 1800,940" fill="#FFFFFF" fill-opacity="0.9" />
    <line x1="1660" y1="240" x2="1660" y2="880" stroke-opacity="0.3" />
    <line x1="1500" y1="300" x2="1500" y2="830" stroke-opacity="0.3" />
  </g>

  <!-- Central Cloud & Cybersecurity Core Matrix -->
  <g transform="translate(960, 520)">
    <circle cx="0" cy="0" r="160" fill="#FFFFFF" stroke="#101B35" stroke-width="2.5" stroke-dasharray="10,6" />
    <circle cx="0" cy="0" r="120" fill="#FFFFFF" stroke="#FF8A00" stroke-width="3" />
    <circle cx="0" cy="0" r="60" fill="#101B35" />

    <!-- Isometric Shield Symbol -->
    <path d="M 0,-35 L 28,-18 L 28,15 C 28,32 0,45 0,45 C 0,45 -28,32 -28,15 L -28,-18 Z" 
          fill="none" stroke="#FFFFFF" stroke-width="2.5" />

    <!-- Radiating Topology Bus -->
    <g stroke="#101B35" stroke-width="2">
      <line x1="0" y1="0" x2="-240" y2="-100" stroke-dasharray="4,4" />
      <circle cx="-240" cy="-100" r="7" fill="#FF8A00" />

      <line x1="0" y1="0" x2="240" y2="-100" stroke-dasharray="4,4" />
      <circle cx="240" cy="-100" r="7" fill="#101B35" />

      <line x1="0" y1="0" x2="-280" y2="90" stroke-dasharray="4,4" />
      <circle cx="-280" cy="90" r="7" fill="#101B35" />

      <line x1="0" y1="0" x2="280" y2="90" stroke-dasharray="4,4" />
      <circle cx="280" cy="90" r="7" fill="#FF8A00" />
    </g>
  </g>

  <!-- Editorial Info Cards -->
  <g font-family="'Plus Jakarta Sans', sans-serif">
    <rect x="80" y="80" width="420" height="150" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    <text x="110" y="120" font-size="12" font-weight="bold" fill="#FF8A00" letter-spacing="2">SECTOR 09 • INFORMATION TECHNOLOGY</text>
    <text x="110" y="155" font-size="22" font-weight="bold" font-family="'Playfair Display', serif" fill="#101B35">Enterprise Cloud &amp; SOC</text>
    <text x="110" y="190" font-size="13" fill="#5A6474">Zero-Trust Cybersecurity • IoT Fleet Telematics</text>

    <rect x="1420" y="80" width="420" height="150" rx="16" fill="#FFFFFF" stroke="#E2E8F0" stroke-width="1.5" />
    <text x="1450" y="120" font-size="12" font-weight="bold" fill="#101B35" letter-spacing="2">SYSTEMS INTEGRATION</text>
    <text x="1450" y="155" font-size="22" font-weight="bold" font-family="'Playfair Display', serif" fill="#101B35">Custom ERP Solutions</text>
    <text x="1450" y="190" font-size="13" fill="#5A6474">Predictive Analytics • 99.99% Availability</text>
  </g>

  <text x="960" y="990" text-anchor="middle" font-family="'Playfair Display', serif" font-size="26" font-style="italic" fill="#101B35" fill-opacity="0.35">
    Arise Hope Group • Software Development, Cloud Infrastructure &amp; Cyber Defense
  </text>
</svg>